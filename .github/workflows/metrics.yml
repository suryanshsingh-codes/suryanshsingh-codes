name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: suryanshsingh-codes
          template: classic
          base: header, activity, community
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_limit: 3
          plugin_languages_colors: github
          plugin_languages_threshold: 0%
          plugin_stars: yes
          plugin_stars_limit: 2
          config_order: base.header, base.activity+community, languages, stars
